<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c1b3f;
            margin: 0;
            padding: 0;
        }
        form {
            width: 50%;
            margin: 0 auto;
            padding: 20px;
            background-color: #2c2b55;
            box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.5);
        }
        legend {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        label {
            display: block;
            color: #fff;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 5px;
            margin-bottom: 10px;
            border: 1px solid #000;
            border-radius: 5px;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
        button {
            background-color: #f59a11;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #f3b354;
        }
        button:active {
            background-color: #f7e4c1;
        }
        h1 {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        label {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        input[type="text"], input[type="email"], textarea {
            font-size: 1.2em;
        }
        input[type="radio"] {
            font-size: 1.2em;
        }
        button {
            font-size: 1.2em;
        }
        button:hover {
            font-size: 1.2em;
        }
        button:active {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <form name="nomeform" onsubmit="return validarFormulario()">
        <h1>Formulário Principal</h1>
        <fieldset>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <label for="comentario">Comentário:</label>
        <textarea id="comentario" name="comentario"></textarea>
        <h1>Pesquisa:</h1>
        <label for="pesquisa">Primeira vez na página?</label>
        <input type="radio" id="sim" name="pesquisa" value="sim">
        <label for="sim">Sim</label>
        <input type="radio" id="nao" name="pesquisa" value="nao">
        <label for="nao">Não</label>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        </fieldset>
    </form>
    <script>
        function validarFormulario()
        {
            let nome = document.nomeform.elements[1].value;
            let email = document.nomeform.elements[2].value;
            let comentario = document.nomeform.elements[3].value;
            let pesquisa = document.nomeform.pesquisa;

            if(nome.length < 10){
                alert("Nome deve ter mais de 10 caracteres");
                return false;
            }
            if(!email.value){
                alert("Email deve ser preenchido!")
                return false;
            }
            if(comentario.length < 20){
                alert("Comentário deve ter mais de 20 caracteres");
                return false;
            }
            if(!pesquisa.value)
            {
                alert("Pesquisa deve ser respondida");
                return false;
            }
            if(pesquisa.value == "sim"){
                alert("Que bom que você voltou a visitar esta página!");
            }
            if(pesquisa.value =="não"){
                alert("Volte sempre à esta página!");
            }
            return true;
        }
    </script>
</body>
</html>
